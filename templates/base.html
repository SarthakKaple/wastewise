<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WasteWise{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f7f5; color: #222; }
    nav { background: #1f6f4a; padding: 14px 24px; }
    nav a { color: white; text-decoration: none; font-weight: bold; margin-right: 20px; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px;
            box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button, .btn { background: #1f6f4a; color: white; border: none; padding: 10px 18px;
                   border-radius: 6px; margin-top: 16px; cursor: pointer;
                   text-decoration: none; display: inline-block; font-size: 14px; }
    .btn-light { background: #5f8f78; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; }
    .flash.success { background: #d9f2e3; color: #14543a; }
    .flash.error { background: #fbdada; color: #8a1f1f; }
    .muted { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">WasteWise</a>
    <a href="{{ url_for('register') }}">New household</a>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
